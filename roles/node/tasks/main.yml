---
- name: Install node repo prerequisites
  ansible.builtin.apt:
    name:
      - gnupg
      - apt-transport-https

- name: Get node apt key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /usr/share/keyrings/nodesource.asc
    mode: '0644'

- name: Determine dpkg architecture for node
  ansible.builtin.command: dpkg --print-architecture
  register: get_architecture
  check_mode: false
  changed_when: false

# Not apt_repository, which only adds lines and would keep stale ones
# (old node versions or keys), which can make apt fail (#4)
- name: Add node apt repository
  ansible.builtin.copy:
    content: >
      deb [arch={{ get_architecture.stdout }}
      signed-by=/usr/share/keyrings/nodesource.asc]
      https://deb.nodesource.com/node_{{ node_version }}.x nodistro main
    dest: /etc/apt/sources.list.d/nodesource.list
    mode: '0644'
  register: node_apt_repository

- name: Get installed nodejs version
  ansible.builtin.command:
    argv:
      - dpkg-query
      - --show
      - "--showformat=${Version}"
      - nodejs
  register: installed_nodejs_version
  check_mode: false
  failed_when: false
  changed_when: false

- name: Install nodejs  # noqa package-latest
  ansible.builtin.apt:
    name: nodejs
    # Also when the version is wrong, in case an earlier run changed the
    # repository but stopped before updating the cache
    update_cache: >-
      {{ node_apt_repository.changed or not node_version_ok | bool }}
    state: "{{ 'present' if node_version_ok | bool else 'latest' }}"
  vars:
    node_version_ok: >-
      {{
        installed_nodejs_version.rc == 0
        and installed_nodejs_version.stdout is match(
          '^(?:[0-9]+:)?' ~ (node_version | string) ~ '\.'
        )
      }}
