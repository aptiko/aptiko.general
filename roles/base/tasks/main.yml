---
- name: Create Aptiko state directory
  ansible.builtin.file:
    path: /var/lib/aptiko.general
    state: directory
    mode: "0755"

- name: Check if base initialization is complete
  ansible.builtin.stat:
    path: /var/lib/aptiko.general/base-initialized
  register: base_initialized

- name: Check legacy base initialization marker
  ansible.builtin.stat:
    path: /etc/ferm/ansible-early
  register: legacy_base_initialized

- name: Update and upgrade if this is a new server
  ansible.builtin.apt:
    update_cache: true
    upgrade: true
  when:
    - not base_initialized.stat.exists
    - not legacy_base_initialized.stat.exists
  notify: Reboot

- name: Mark base initialization complete
  ansible.builtin.copy:
    content: ""
    dest: /var/lib/aptiko.general/base-initialized
    force: false
    mode: "0644"

- name: Check if tmp.mount exists
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/tmp.mount
  register: tmp_mount_unit

- name: Do not use tmpfs for /tmp
  ansible.builtin.systemd:
    name: tmp.mount
    masked: true
    enabled: false
    daemon_reload: true
  when: tmp_mount_unit.stat.exists
  notify: Reboot

- name: Reboot if needed
  ansible.builtin.meta: flush_handlers

- name: Uninstall packages we don't want
  ansible.builtin.apt:
    name:
      - unattended-upgrades
    state: absent

- name: Install common apt packages
  ansible.builtin.apt:
    name:
      - sudo
      - ca-certificates
      - ntpsec
      - debian-goodies
      - locales

- name: Install locales
  community.general.locale_gen:
    name: "{{ item }}"
    state: present
  with_items:
    - en_US.UTF-8
    - en_DK.UTF-8

# SSH keys

- name: Create /root/.ssh
  ansible.builtin.file:
    state: directory
    dest: /root/.ssh
    mode: "0700"

- name: Install ssh public key
  ansible.builtin.copy:
    content: "{{ base_ssh_pub_key }}\n"
    dest: /root/.ssh/id_rsa.pub
    mode: "0755"
  when: base_ssh_pub_key | default('') | length > 0

- name: Install ssh private key
  ansible.builtin.copy:
    content: "{{ base_ssh_priv_key }}\n"
    dest: /root/.ssh/id_rsa
    mode: "0600"
  when: base_ssh_priv_key | default('') | length > 0

- name: Setup root authorized keys
  ansible.posix.authorized_key:
    user: root
    exclusive: true
    key: "{% for key in base_root_authorized_keys %}{{ key }}\n{% endfor %}"
  when: base_root_authorized_keys | default([]) | length > 0

- name: Allow root to ssh without password
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: ^PermitRootLogin
    line: PermitRootLogin without-password
  notify: Reload ssh

- name: Configure ssh port
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: ^#?Port
    line: Port {{ base_ssh_port }}
  notify: Reload ssh

- name: Install bashrc for root
  ansible.builtin.template:
    src: bashrc.j2
    dest: /root/.bashrc
    mode: "0644"

- name: Configure systemd-journald
  ansible.builtin.template:
    src: journald.conf
    dest: /etc/systemd/journald.conf
    mode: "0644"
  notify: Restart journald

# Node exporter

- name: Install node-exporter
  ansible.builtin.apt:
    name:
      - prometheus-node-exporter
  when: base_prometheus_server_ips | default('') | length > 0

- name: Configure firewall
  ansible.builtin.import_tasks: firewall.yml
  when: base_setup_firewall

- name: Update and check for reboots
  ansible.builtin.import_tasks: update.yml
  tags:
    - never
    - update
